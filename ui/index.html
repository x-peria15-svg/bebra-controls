<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Bebra Control</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="titlebar"><span class="title-brand">BE<span class="brand-accent">B</span>RA <span class="title-light">CONTROL</span></span><span class="title-location">Servers <span class="tiny-dot"></span> Server Control</span><div class="window-controls"><button data-window="minimize" aria-label="Свернуть">−</button><button data-window="maximize" aria-label="Развернуть">□</button><button data-window="close" aria-label="Закрыть">×</button></div></div>
<div class="app-shell"><aside class="rail"><button id="brand" class="logo" title="Все серверы" aria-label="Все серверы">B<span></span></button><button id="overview-button" class="rail-icon" title="Обзор VPS" aria-label="Обзор VPS"></button><div class="rail-divider"></div><nav id="server-nav" aria-label="Серверы"></nav><div class="rail-bottom"><button id="panel-button" class="rail-icon" title="Веб-панель" aria-label="Открыть веб-панель"></button><button id="settings-button" class="rail-icon" title="Подключение" aria-label="Настройки подключения"></button><button id="account-button" class="avatar" title="Аккаунт" aria-label="Аккаунт">TB</button></div></aside>
<main class="workspace"><header id="server-header" class="server-header"></header><nav id="tabs" class="tabs" aria-label="Разделы сервера"></nav><section id="metrics" class="metrics" aria-label="Ресурсы"></section><div id="content" class="content"><div class="initial-loading"><span class="spinner"></span>Подключение к твоему VPS…</div></div><footer><div id="connection-state"><span class="tiny-dot"></span> Подключение…</div><span id="footer-info">Bebra Control 1.1 beta</span><button id="refresh-all" title="Обновить данные">Обновить</button></footer></main></div>
<div id="toasts" aria-live="polite"></div><dialog id="modal"></dialog><script type="module" src="platform.js"></script>
</body></html>
